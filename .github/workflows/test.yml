name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Two runtime dependencies, so this stays fast and is worth knowing about
      # on a self-hosted app. Dev-only advisories don't reach a deployment.
      - run: npm audit --omit=dev --audit-level=high
