<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flip Helper - OSRS Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1><a href="index.html">OSRS Tracker</a></h1>
    <nav></nav>
    <div id="sessionBar" class="session-bar"></div>
  </header>
  <main>
    <div class="search-row">
      <input id="flipSearch" type="text" placeholder="Filter results by item name..." aria-label="Filter results by item name" autocomplete="off" />
    </div>

    <div class="page-toolbar" id="presetToolbar">
      <div class="submenu" id="presetStrip">
        <button type="button" data-preset="penny" title="Cheap, heavily traded items under 1,000 gp - low capital per flip, profit comes from turnover.">Penny Arcade</button>
        <button type="button" data-preset="margin" title="Biggest profit after tax on a single item.">High Margin</button>
        <button type="button" data-preset="roi" title="Best profit as a percentage of what you tie up.">Best ROI</button>
        <button type="button" data-preset="gpPerHour" title="Profit after tax scaled by how fast the buy limit could realistically fill.">GP / Hour</button>
        <button type="button" data-preset="composite" title="Best all-round score: ROI, throughput, volume, freshness and confidence combined.">Best Overall</button>
        <button type="button" data-preset="bankroll" title="Ranked by what you would actually make with the bankroll set below.">Fits My Bankroll</button>
      </div>
      <div class="page-toolbar-end">
        <button type="button" data-preset="watchlist" class="page-toolbar-tab">★ Watchlist</button>
        <button type="button" id="f2pFilterBtn" class="page-toolbar-tab f2p-toggle" title="Show free-to-play items only. Click again to show all items." aria-pressed="false">F2P</button>
        <label class="page-size">Per page
          <select id="pageSize">
            <option value="5">5</option>
            <option value="10">10</option>
            <option value="25">25</option>
            <option value="50" selected>50</option>
          </select>
        </label>
      </div>
    </div>

    <div class="filters">
      <details class="filter-drawer">
        <summary>Filters</summary>
        <div class="filter-fields">
          <label>Bankroll (gp) <input id="bankroll" type="number" min="0" step="1000" placeholder="0" /></label>
          <label>Min. volume <input id="minVolume" type="number" min="0" step="100" value="1000" /></label>
          <label>Min. price <input id="minPrice" type="number" min="0" step="10" value="50" /></label>
          <label>Max. price <input id="maxPrice" type="number" min="0" step="10" placeholder="none" /></label>
          <label>Min. profit <input id="minMargin" type="number" min="0" step="100" value="0" /></label>
          <label>Min. ROI % <input id="minRoi" type="number" min="0" step="0.5" value="0" /></label>
          <label title="Current margin divided by this item's own average 24h margin. 1.8 = spread is 80% wider than usual.">Min. margin vs avg <input id="minMarginVsAvg" type="number" min="0" step="0.1" placeholder="any" /></label>
          <label>Max age (min) <input id="maxAgeMinutes" type="number" min="0" step="1" placeholder="none" /></label>
          <label>Members
            <select id="membersOnly">
              <option value="all">All</option>
              <option value="members">Members</option>
              <option value="f2p">F2P</option>
            </select>
          </label>
        </div>
      </details>
      <div class="filter-actions">
        <button type="button" id="resetBtn" class="btn-outline" title="Restore the default filters.">Reset</button>
        <button type="button" id="scanBtn">Scan</button>
      </div>
    </div>

    <div id="status" class="status"></div>
    <h2 id="resultsTitle">All flips</h2>
    <div id="flipResults">
      <label class="flip-sort">Sort
        <select id="flipSort">
          <option value="name">Item (A-Z)</option>
        </select>
        <button type="button" id="sortDirBtn" class="btn-outline" title="Toggle sort direction">↓ High to low</button>
      </label>
      <div class="flip-toolbar">
        <button type="button" id="columnsBtn" class="btn-outline">Select Columns</button>
      </div>
      <!-- Checkbox rows, table headers and sort options are generated from
           COLUMNS in src/client/flipColumns.ts. -->
      <div id="columnsPanel" class="columns-panel" hidden>
        <div class="columns-panel-actions">
          <button type="button" id="setDefaultBtn" class="btn-outline" title="Save the columns currently checked above as what loads every time you open this page.">Set as Default</button>
          <button type="button" id="resetDefaultBtn" class="btn-outline" title="Forget any saved default and go back to the built-in starting columns.">Reset to Factory Default</button>
          <span id="columnsDefaultStatus" class="columns-default-status"></span>
        </div>
      </div>
      <div class="table-wrap flip-table-wrap">
        <table id="flipTable">
          <thead>
            <tr>
              <th title="Star to watchlist, or send buy/sell into the calculator below."></th>
              <th data-sort="name" title="Item name - click through to its item page for the full price chart.">Item</th>
            </tr>
          </thead>
          <tbody id="flipBody"></tbody>
        </table>
      </div>
      <div id="flipCards" class="flip-cards"></div>
      <div class="flip-pagination">
        <button type="button" id="pagePrev">‹ Prev</button>
        <span id="pageIndicator">Page 1 of 1</span>
        <button type="button" id="pageNext">Next ›</button>
      </div>
    </div>

    <h2 class="cl-grid-title calc-heading" id="calcHeading">
      <span>Flip calculator<span id="calcSelectedLabel"></span></span>
      <span class="calc-actions">
        <button type="button" id="returnToItemBtn" class="btn-outline calc-return" hidden>Return to item</button>
        <a href="ge.html" id="backToGe" class="btn-outline calc-return calc-link" hidden>&larr; Back to Grand Exchange</a>
      </span>
    </h2>
    <div class="filters calc-row">
      <label>Buy <input id="calcBuy" type="number" min="0" /></label>
      <label>Sell <input id="calcSell" type="number" min="0" /></label>
      <label>Qty <input id="calcQty" type="number" min="1" value="1" /></label>
    </div>
    <div class="summary">
      <div><strong id="calcTax">n/a</strong><span>GE tax (total)</span></div>
      <div><strong id="calcProfit">n/a</strong><span>Net profit</span></div>
      <div><strong id="calcRoi">n/a</strong><span>ROI</span></div>
      <div><strong id="calcCapital">n/a</strong><span>Capital</span></div>
    </div>
  </main>
  <script type="module" src="client/flip.js"></script>
</body>
</html>
