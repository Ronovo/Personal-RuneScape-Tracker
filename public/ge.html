<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Grand Exchange Tracker - OSRS Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>OSRS Tracker</h1>
    <nav>
      <a href="character.html">Character</a>
      <a href="collectionlog.html">Collection Log</a>
      <a href="ge.html" class="active">Grand Exchange</a>
      <a href="flip.html">Flip Helper</a>
    </nav>
    <div id="sessionBar" class="session-bar"></div>
  </header>
  <main>
    <div class="search-row">
      <input id="itemSearch" type="text" placeholder="Search an item... (leave empty for top movers)" autocomplete="off" />
    </div>

    <div class="filters">
      <details class="filter-drawer" open>
        <summary>Filters</summary>
        <div class="filter-fields">
          <label>Min. daily volume <input id="minVolume" type="number" value="500" min="0" step="100" /></label>
          <label>Min. price (gp) <input id="minPrice" type="number" value="50" min="0" step="10" /></label>
          <label>Max. price (gp) <input id="maxPrice" type="number" min="0" step="10" placeholder="none" /></label>
          <label>Sort
            <select id="sortBy">
              <option value="pctChange">% change</option>
              <option value="volume">Daily volume</option>
              <option value="price">Price</option>
              <option value="marginAfterTax">Margin after tax</option>
              <option value="profitPerLimit">Profit at buy limit</option>
            </select>
          </label>
          <label>Members
            <select id="membersOnly">
              <option value="all">All</option>
              <option value="members">Members</option>
              <option value="f2p">F2P</option>
            </select>
          </label>
          <label class="filter-check"><input id="hideStale" type="checkbox" /> Hide stale (&gt;30m)</label>
        </div>
      </details>
      <button id="refreshBtn">Refresh</button>
    </div>

    <div class="ge-toolbar">
      <div class="submenu" id="directionToggle">
        <button type="button" data-view="risers" class="active">Rising</button>
        <button type="button" data-view="fallers">Dropping</button>
        <button type="button" data-view="penny" title="Cheap, heavily traded items under 1,000 gp." aria-label="Penny Arcade: Cheap, heavily traded items under 1,000 gp.">Penny Arcade</button>
        <button type="button" data-view="random" title="A random set of fresh, actively traded items. Click again to reroll." aria-label="Random: A random set of fresh, actively traded items. Click again to reroll.">Random</button>
        <button type="button" data-view="spread" title="Fresh, liquid items with the largest positive margin after GE tax." aria-label="Spread: Fresh, liquid items with the largest positive margin after GE tax.">Spread</button>
        <button type="button" data-view="staircase" title="Items rising across the 1-hour, 6-hour, and 24-hour views." aria-label="Staircase: Items rising across the 1-hour, 6-hour, and 24-hour views.">Staircase</button>
      </div>
      <label class="ge-page-size"># of Items
        <select id="gridSize">
          <option value="5">5</option>
          <option value="10">10</option>
          <option value="25" selected>25</option>
          <option value="50">50</option>
        </select>
      </label>
    </div>

    <div id="status" class="status"></div>
    <h2 id="gridTitle">Rising (24h)</h2>
    <div id="grid" class="ge-grid"></div>
  </main>
  <script type="module" src="ge.js"></script>
</body>
</html>
